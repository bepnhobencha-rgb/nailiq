      @import url('https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700&amp;display=swap');
      text { font-family: 'Be Vietnam Pro', system-ui, sans-serif; font-weight: 700; }
    </style>
  </defs>
  <!-- Dark background for NailIQ -->
