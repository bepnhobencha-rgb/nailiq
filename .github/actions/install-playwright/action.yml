name: Install Playwright browsers
description: Install pinned Playwright browsers without the unrelated system Chrome APT source
inputs:
  browsers:
    description: Space-separated Playwright browser names
    required: true
runs:
  using: composite
  steps:
    - name: Install browser dependencies and binaries
      shell: bash
      env:
        BROWSERS: ${{ inputs.browsers }}
      run: |
        set -euo pipefail
        read -r -a browsers <<< "$BROWSERS"
        test "${#browsers[@]}" -gt 0
        for browser in "${browsers[@]}"; do
          case "$browser" in
            chromium|webkit|firefox) ;;
            *) echo "Unsupported Playwright browser: $browser" >&2; exit 1 ;;
          esac
        done
        if [[ "$RUNNER_OS" == "Linux" ]]; then
          # Playwright downloads its own pinned browsers. The runner's system
          # Chrome source can break apt update with unrelated index hash errors.
          # Match actions/runner-images install-google-chrome.sh cleanup; retain
          # normal APT signature/hash verification for dependency repositories.
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.list.save
        fi
        npx playwright install --with-deps "${browsers[@]}"
