name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_PUBLIC_SENTRY_DSN: ""
      SENTRY_AUTH_TOKEN: ""
      NEXT_PUBLIC_DEMO_OTP: "true"
      DEMO_OTP: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium webkit --with-deps
      - name: Run E2E Tests
        # `--reporter=list,html` gives per-spec live progress (so the
        # CI log shows which spec is currently running / hanging) plus
        # an HTML report artifact for post-mortem. The default dot
        # reporter interleaves with `--workers=2` and hides the hung
        # spec when the job hits its 60-minute hard timeout.
        run: npm run test:e2e -- --workers=2 --reporter=list,html
      - uses: actions/upload-artifact@v4
        # Upload on every outcome, not only `failure()`. GitHub
        # Actions treats workflow-timeout `cancelled` as neither
        # success nor failure, so the report was being skipped exactly
        # when we needed it most.
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
