name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  i18n-check:
    name: i18n & Copy Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run check:i18n

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: i18n-check
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      BASE_URL: http://localhost:3000
      PLAYWRIGHT_BASE_URL: http://localhost:3000
      NEXT_PUBLIC_SENTRY_DSN: ""
      SENTRY_AUTH_TOKEN: ""
      NEXT_PUBLIC_DEMO_OTP: "true"
      DEMO_OTP: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit
      - name: Build app
        run: npm run build
      - name: Start dev server (background) & verify it boots within 30s
        # Pre-flight: if `next dev` can't serve a request within 30s the
        # job fails here with a clear message rather than burning the
        # full 15-min budget on Playwright's silent webServer wait.
        # Playwright is configured with reuseExistingServer: true so the
        # test step picks up this same process.
        run: |
          mkdir -p tmp
          nohup npx next dev > tmp/next-dev.log 2>&1 &
          echo "$!" > tmp/next-dev.pid
          npx --yes wait-on http://localhost:3000 --timeout 30000 --interval 500 || {
            echo "::error::Dev server did not respond on http://localhost:3000 within 30s"
            echo "--- next-dev.log (last 200 lines) ---"
            tail -n 200 tmp/next-dev.log || true
            exit 1
          }
          echo "::notice::Dev server up after pre-flight check"
      - name: Decide which specs to run
        id: scope
        run: |
          if [ -n "${SUPABASE_SERVICE_ROLE_KEY:-}" ]; then
            echo "specs=" >> "$GITHUB_OUTPUT"
            echo "mode=full" >> "$GITHUB_OUTPUT"
            echo "::notice::SUPABASE_SERVICE_ROLE_KEY present — running full E2E suite"
          else
            echo "specs=e2e/content e2e/accessibility" >> "$GITHUB_OUTPUT"
            echo "mode=db-free" >> "$GITHUB_OUTPUT"
            echo "::warning::SUPABASE_SERVICE_ROLE_KEY missing — skipping DB-dependent specs (running i18n/copy + a11y only)"
          fi
      - name: Run E2E tests
        run: npx playwright test ${{ steps.scope.outputs.specs }} --reporter=list,html,json
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: playwright-report/results.json
      - name: Summarize results
        if: always()
        run: node scripts/playwright-summary.js >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  visual-tests:
    name: Visual Regression
    runs-on: ubuntu-latest
    needs: i18n-check
    # Visual baselines drift across OS/browser versions, so we only run
    # them on push-to-main where the baseline-update flag is meaningful.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      BASE_URL: http://localhost:3000
      PLAYWRIGHT_BASE_URL: http://localhost:3000
      NEXT_PUBLIC_SENTRY_DSN: ""
      SENTRY_AUTH_TOKEN: ""
      NEXT_PUBLIC_DEMO_OTP: "true"
      DEMO_OTP: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run build
      - name: Detect snapshot-update intent
        id: snap
        run: |
          if echo "${{ github.event.head_commit.message }}" | grep -qiF "[update-snapshots]"; then
            echo "flag=--update-snapshots" >> "$GITHUB_OUTPUT"
            echo "::notice::Commit message contains [update-snapshots] — refreshing visual baselines"
          else
            echo "flag=" >> "$GITHUB_OUTPUT"
          fi
      - name: Run visual tests
        run: npx playwright test e2e/visual ${{ steps.snap.outputs.flag }} --reporter=list,html
      - name: Upload visual diff artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diffs
          path: |
            playwright-report/
            test-results/
          retention-days: 14
      - name: Upload updated snapshots
        if: success() && steps.snap.outputs.flag != ''
        uses: actions/upload-artifact@v4
        with:
          name: updated-snapshots
          path: e2e/visual/__screenshots__/
          retention-days: 14
