name: Migration History Rehearsal

on:
  pull_request:
    paths:
      - ".github/workflows/migration-history-rehearsal.yml"
      - "scripts/audit-migration-history.mjs"
      - "scripts/build-folded-migration-history.mjs"
      - "scripts/check-schema-parity.ts"
      - "scripts/security/rehearse-postgres-backup-restore.mjs"
      - "scripts/security/check-branch-tenant-isolation-boundary.sql"
      - "scripts/security/rehearse-branch-tenant-isolation.sql"
      - "scripts/security/check-no-duplicate-appointments-boundary.sql"
      - "scripts/security/check-setup-catalog-mutation-rls.sql"
      - "scripts/security/assert-setup-catalog-denied.psql"
      - "scripts/security/rehearse-no-duplicate-appointments-concurrency.mjs"
      - "scripts/security/check-staff-action-notification-outbox-boundary.sql"
      - "scripts/security/rehearse-resend-owner-delivery-truth.sql"
      - "scripts/security/rehearse-resend-customer-delivery-truth.sql"
      - "scripts/security/rehearse-booking-otp-delivery-truth.sql"
      - "scripts/security/rehearse-no-show-safety-boundary.sql"
      - "scripts/security/rehearse-staff-offboarding-durable.sql"
      - "scripts/security/rehearse-staff-offboarding-durable-sequence.sql"
      - "scripts/security/rehearse-staff-offboarding-durable-concurrency.mjs"
      - "scripts/security/rehearse-staff-offboarding-durable-rollback.sql"
      - "scripts/security/rehearse-reactivation-campaign-delivery-contract.sql"
      - "scripts/security/rehearse-reactivation-campaign-delivery-concurrency.mjs"
      - "scripts/security/rehearse-v1-terminal-booking-policy.sql"
      - "scripts/verify-schema-dump.ts"
      - "supabase/bootstrap/**"
      - "supabase/migration-history/**"
      - "supabase/migrations/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  folded-history:
    name: Folded history on blank Supabase
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - uses: supabase/setup-cli@v2
        with:
          version: 2.109.1

      - name: Install PostgreSQL 17 client
        run: |
          set -euo pipefail
          sudo install -d /usr/share/postgresql-common/pgdg
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo gpg --batch --yes --dearmor -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.gpg
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.gpg] https://apt.postgresql.org/pub/repos/apt noble-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
          test -x /usr/lib/postgresql/17/bin/pg_dump
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"

      - name: Audit deploy-ready production prefix
        run: npm run db:history:audit -- --deploy-ready

      - name: Rebuild and compare folded history
        run: |
          set -euo pipefail
          node scripts/build-folded-migration-history.mjs \
            --output "$RUNNER_TEMP/folded-migrations"
          npx tsx scripts/verify-schema-dump.ts \
            "$RUNNER_TEMP/folded-migrations/20260723000000_folded_production_schema_baseline.sql"

          count="$(find "$RUNNER_TEMP/folded-migrations" -maxdepth 1 -type f -name '*.sql' | wc -l)"
          unique="$(find "$RUNNER_TEMP/folded-migrations" -maxdepth 1 -type f -name '*.sql' -printf '%f\n' | cut -c1-14 | sort -u | wc -l)"
          expected="$(find supabase/migrations -maxdepth 1 -type f -name '*.sql' | wc -l)"
          test "$count" -eq "$expected"
          test "$unique" -eq "$expected"
          diff -qr "$RUNNER_TEMP/folded-migrations" supabase/migrations

      - name: Apply folded history to blank Supabase
        run: |
          set -euo pipefail

          supabase start --exclude studio,edge-runtime,logflare,vector
          supabase status -o env > "$RUNNER_TEMP/supabase.env"
          set -a
          . "$RUNNER_TEMP/supabase.env"
          set +a

          NEXT_PUBLIC_SUPABASE_URL="${API_URL}" \
            SUPABASE_SERVICE_ROLE_KEY="${SERVICE_ROLE_KEY}" \
            npx tsx scripts/assert-e2e-not-production.ts

          DB_URL="${DB_URL}" npx tsx scripts/check-schema-parity.ts
          psql "$DB_URL" -v ON_ERROR_STOP=1 -q \
            -f supabase/bootstrap/reference-data.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -q \
            -f scripts/security/check-public-page-management-rls.sql
