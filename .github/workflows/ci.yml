name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build & Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate Vercel lockfile
        run: npx --yes pnpm@10.34.5 install --lockfile-only --frozen-lockfile --ignore-scripts

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy
          SUPABASE_SERVICE_ROLE_KEY: dummy

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: npm audit (high severity)
        run: npm audit --package-lock-only --audit-level=high

      - name: pnpm audit for Vercel (high severity)
        run: npx --yes pnpm@10.34.5 audit --audit-level=high

      - name: Check for committed secrets
        run: |
          if grep -rE "(SUPABASE_SERVICE_ROLE_KEY).*=.*[a-zA-Z0-9]{10,}" \
            --include="*.ts" --include="*.tsx" --include="*.js" --include="*.json" \
            --exclude-dir=node_modules --exclude-dir=.next .; then
            echo "❌ Possible secrets found in committed code!"
            exit 1
          fi
          echo "✅ No obvious secrets in code"

  password-reset-form:
    name: Password reset form browser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - name: Build isolated component fixture (no Auth or database)
        run: npx next build qa/password-reset-form --webpack
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - name: Test password reset response recovery
        run: npx playwright test -c qa/password-reset-form/playwright.config.ts
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: password-reset-form-results
          path: test-results/
          retention-days: 14

  signout-response:
    name: Sign-out response browser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - name: Build isolated component fixture (no Auth or database)
        run: npx next build qa/signout-response --webpack
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - name: Test sign-out response recovery
        run: npx playwright test -c qa/signout-response/playwright.config.ts
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: signout-response-results
          path: test-results/
          retention-days: 14

  session-read:
    name: Session read recovery browser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - name: Build isolated component fixture (no Auth or database)
        run: npx next build qa/session-read --webpack
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - name: Test session read recovery
        run: npx playwright test -c qa/session-read/playwright.config.ts
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: session-read-results
          path: test-results/
          retention-days: 14

  booking-country-phone:
    name: Booking country phone browser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - name: Build isolated country phone fixture (no Auth or database)
        run: npx next build qa/booking-country-phone --webpack
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - name: Test country phone contrast and interaction
        run: npx playwright test -c qa/booking-country-phone/playwright.config.ts
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: booking-country-phone-results
          path: test-results/booking-country-phone/
          if-no-files-found: error
          retention-days: 14

  users-hydration:
    name: Superadmin users hydration browser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
